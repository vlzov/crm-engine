<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM</title><link rel="stylesheet" href="/styles.css"></head><body><div id="auth" class="auth"><div class="auth-card"><div class="brand">◈ CRM</div><h1>Вход в CRM</h1><p>Введите логин и пароль для продолжения.</p><form id="loginForm"><input name="username" placeholder="Логин" autocomplete="username" required><input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required><button class="primary">Войти</button><div id="loginError" class="error" hidden></div></form></div></div><div id="app" hidden><aside><div class="brand">◈ CRM</div><nav><button class="nav active" data-view="dashboard">Обзор</button><button class="nav" data-view="customers">Клиенты</button><button class="nav" data-view="deals">Сделки</button><button class="nav" data-view="tasks">Задачи</button></nav><div class="side-note">Учебная версия<br><span>Авторизация отключена</span></div></aside><main><header><div><p class="eyebrow">Рабочее пространство</p><h1 id="title">Обзор</h1></div><div class="header-actions"><span id="userLabel"></span><button class="refresh" id="refresh">↻ Обновить</button><button class="logout" id="logout">Выйти</button></div></header><section id="content"></section></main></div><script src="/app.js"></script></body></html>
