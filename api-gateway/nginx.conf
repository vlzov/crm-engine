upstream auth_service { server auth-service:8080; }
upstream customer_service { server customer-service:8080; }
upstream sales_service { server sales-service:8080; }
upstream task_service { server task-service:8080; }
server {
  listen 80;
  location /actuator/health { add_header Content-Type application/json; return 200 '{"status":"UP"}'; }
  location = /api/auth { proxy_pass http://auth_service/api/auth; proxy_set_header Host $host; }
  location = /api/customers { proxy_pass http://customer_service/api/customers; proxy_set_header Host $host; }
  location = /api/deals { proxy_pass http://sales_service/api/deals; proxy_set_header Host $host; }
  location = /api/tasks { proxy_pass http://task_service/api/tasks; proxy_set_header Host $host; }
  location /api/auth/ { proxy_pass http://auth_service/api/auth/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/customers/ { proxy_pass http://customer_service/api/customers/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/deals/ { proxy_pass http://sales_service/api/deals/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/tasks/ { proxy_pass http://task_service/api/tasks/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
