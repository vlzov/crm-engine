services:
  auth-service:
    build: ./services/auth-service
    environment: {KAFKA_BOOTSTRAP_SERVERS: kafka:9092, PORT: 8080}
    ports: ["8081:8080"]
    depends_on: {kafka: {condition: service_started}}
  customer-service:
    build: ./services/customer-service
    environment: {KAFKA_BOOTSTRAP_SERVERS: kafka:9092, PORT: 8080}
    ports: ["8082:8080"]
    depends_on: {kafka: {condition: service_started}}
  sales-service:
    build: ./services/sales-service
    environment: {KAFKA_BOOTSTRAP_SERVERS: kafka:9092, PORT: 8080}
    ports: ["8083:8080"]
    depends_on: {kafka: {condition: service_started}}
  task-service:
    build: ./services/task-service
    environment: {KAFKA_BOOTSTRAP_SERVERS: kafka:9092, PORT: 8080}
    ports: ["8084:8080"]
    depends_on: {kafka: {condition: service_started}}
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      app: {condition: service_started}
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/crm
      DB_USER: crm
      DB_PASSWORD: crm
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting}
      SEED_CLIENT_USERNAME: ${SEED_CLIENT_USERNAME:?Set SEED_CLIENT_USERNAME in .env}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:?Set SEED_CLIENT_PASSWORD in .env}
      SEED_OPERATOR_USERNAME: ${SEED_OPERATOR_USERNAME:?Set SEED_OPERATOR_USERNAME in .env}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:?Set SEED_OPERATOR_PASSWORD in .env}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:?Set SEED_ADMIN_USERNAME in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      redis: {condition: service_started}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports: ["5432:5432"]
    volumes: [crm-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U crm -d crm"], interval: 5s, timeout: 5s, retries: 10}
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: yes
    ports: ["9092:9092"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: {crm-data: {}}
