services:
  auth-service:
    restart: unless-stopped
    build: ./services/auth-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/crm_auth
      DB_USER: crm
      DB_PASSWORD: crm
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_CLIENT_USERNAME: ${SEED_CLIENT_USERNAME:?Set seed vars}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:?Set seed vars}
      SEED_OPERATOR_USERNAME: ${SEED_OPERATOR_USERNAME:?Set seed vars}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:?Set seed vars}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:?Set seed vars}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set seed vars}
    depends_on:
      kafka: {condition: service_started}
      postgres: {condition: service_healthy}
  customer-service:
    restart: unless-stopped
    build: ./services/customer-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/crm_customer
      DB_USER: crm
      DB_PASSWORD: crm
      PORT: 8080
    depends_on:
      kafka: {condition: service_started}
      postgres: {condition: service_healthy}
  sales-service:
    restart: unless-stopped
    build: ./services/sales-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/crm_sales
      DB_USER: crm
      DB_PASSWORD: crm
      PORT: 8080
    depends_on:
      kafka: {condition: service_started}
      postgres: {condition: service_healthy}
  task-service:
    restart: unless-stopped
    build: ./services/task-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/crm_task
      DB_USER: crm
      DB_PASSWORD: crm
      PORT: 8080
    depends_on:
      kafka: {condition: service_started}
      postgres: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      api-gateway: {condition: service_started}
  api-gateway:
    build: ./api-gateway
    ports: ["8080:80"]
    depends_on: [auth-service, customer-service, sales-service, task-service]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports: ["5432:5432"]
    volumes:
      - crm-data:/var/lib/postgresql/data
      - ./infra/postgres/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U crm -d crm"], interval: 5s, timeout: 5s, retries: 10}
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["9092:9092"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: {crm-data: {}}
