spring:
  application.name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}
  jpa:
    hibernate.ddl-auto: update
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
server.port: ${PORT:8080}
management.endpoints.web.exposure.include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-chars}
    access-ttl-seconds: 900
  seed:
    client:
      username: "${SEED_CLIENT_USERNAME:client}"
      password: "${SEED_CLIENT_PASSWORD:change-client-password}"
    operator:
      username: "${SEED_OPERATOR_USERNAME:operator}"
      password: "${SEED_OPERATOR_PASSWORD:change-operator-password}"
    admin:
      username: "${SEED_ADMIN_USERNAME:admin}"
      password: "${SEED_ADMIN_PASSWORD:change-admin-password}"
