spring:
  application.name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}
  jpa:
    hibernate.ddl-auto: validate
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
server.port: ${PORT:8080}
management.endpoints.web.exposure.include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET is required}
    access-ttl-seconds: 900
  seed:
    client:
      username: "${SEED_CLIENT_USERNAME:?seed secret required}"
      password: "${SEED_CLIENT_PASSWORD:?seed secret required}"
    operator:
      username: "${SEED_OPERATOR_USERNAME:?seed secret required}"
      password: "${SEED_OPERATOR_PASSWORD:?seed secret required}"
    admin:
      username: "${SEED_ADMIN_USERNAME:?seed secret required}"
      password: "${SEED_ADMIN_PASSWORD:?seed secret required}"
