spring:
  datasource:
    url: jdbc:h2:mem:crmtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: create-drop
  flyway.enabled: false
  autoconfigure.exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
app:
  jwt:
    secret: test-secret-key-123456789012345678901234
    access-ttl-seconds: 900
  seed:
    client: {username: seed-client, password: seed-client-pass}
    operator: {username: seed-operator, password: seed-operator-pass}
    admin: {username: seed-admin, password: seed-admin-pass}
